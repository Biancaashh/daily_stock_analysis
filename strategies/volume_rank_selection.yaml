name: volume_rank_selection
display_name: 成交榜选股
description: 每日收盘后按全市场成交金额排名，从前50名中筛选主力资金真正介入、具备短线主升浪潜力的品种。
category: trend
core_rules: [2, 3, 5, 6]
required_tools:
  - get_market_volume_ranking
  - get_daily_history
  - analyze_trend
  - get_financial_data
  - get_realtime_quote
aliases: [成交榜, 成交量排名, 成交榜选股法, 主力资金选股]
default_priority: 85
market_regimes: [trending_up, sector_hot, volatile]

instructions: |
  **成交榜选股法（Volume Ranking Stock Selection）**

  本策略每日收盘后执行，核心逻辑：成交量放大代表主力资金介入，排在全市场前50名说明主力真正"上班"了。
  目标是在主力已经进场的品种中，找到即将走出主升浪的短线机会。

  ---

  ## 第一步：建立初始成交榜池（前50名）

  1. 调用 `get_market_volume_ranking` 获取当日全市场（沪深两市，约5100支股票）按**成交金额**从高到低的排名。
  2. 取成交金额排名前50的品种，建立"初始成交榜池"。
  3. 记录每只股票的：代码、名称、成交金额、涨跌幅、当日成交量。

  > **逻辑依据**：成交金额排在全市场前50，说明有大体量资金（机构或游资）在当日积极操作该品种，主力资金"上班"是短线机会的前提条件。

  ---

  ## 第二步：三重剔除标准（逐一筛查）

  对初始池中的每只股票，依次执行以下三个剔除判断：

  ### 剔除标准一：涨幅不足（关联理念3：量价配合）
  - 使用 `get_realtime_quote` 获取当日涨跌幅数据。
  - **剔除条件**：当日涨幅 < 5%（含4.99%及以下，涨停板（+10%）除外）。
  - **判断逻辑**：主力资金大量介入但股价涨幅小于5%，说明主力仍处于建仓或横盘蓄势阶段，尚未启动拉升。既然主力没有决定拉升，不宜提前埋伏，避免资金空耗在等待周期中。
  - 涨幅在5%～20%之间（包含涨停）为合格区间，保留。

  ### 剔除标准二：中期趋势向下（关联理念2：趋势交易）
  - 使用 `get_daily_history`（获取60日K线）+ `analyze_trend` 分析30日均线方向。
  - **剔除条件**：30日均线（MA30）处于走平（斜率绝对值 < 0.1%/日）或向下（斜率为负）状态。
  - **判断逻辑**：30日均线代表股票中短线趋势。主线向下时放巨量，往往是主力出货或反弹卖点，而非启动信号。只有MA30向上，趋势才是顺风方向，短线机会才具备持续性。
  - MA30明确向上（斜率 > 0.1%/日）为合格，保留。

  ### 剔除标准三：净资产为负（关联理念5：风险排查）
  - 使用 `get_financial_data` 获取最近一年（最新年报或最新季报）的每股净资产数据。
  - **剔除条件**：最近一年任意报告期净资产为负（每股净资产 < 0）。
  - **判断逻辑**：净资产为负的品种基本面极差，是"恶庄"最喜欢蹲守的地方。恶庄在这类股票中制造虚假放量，诱骗散户接盘出货。该标准专门用于规避踩雷风险，即使成交量再大也坚决剔除。
  - 净资产 ≥ 0 为合格，保留。

  ---

  ## 第三步：建立"主升浪候选池"并输出结果

  1. 经过三重剔除后的剩余品种，进入**主升浪候选池**。
  2. 对候选池中每只股票，输出以下信息：
     - 成交金额排名（在全市场的名次）
     - 当日涨幅
     - 30日均线方向（向上/走平/向下）及斜率
     - 最新净资产状况
     - 所属板块及板块热度
     - 综合评分调整（见下方）

  3. 按以下优先级排序候选池：
     - 优先：涨幅 8%～20%（有力度但未过热）
     - 其次：成交金额排名越靠前越好（资金越集中）
     - 辅助：MA30斜率越陡峭，趋势越强

  ---

  ## 评分调整规则

  满足所有三个剔除标准（即通过筛选，进入候选池）：
  - 成交金额全市场前10名：sentiment_score **+15**
  - 成交金额全市场第11～30名：sentiment_score **+10**
  - 成交金额全市场第31～50名：sentiment_score **+6**
  - 涨幅 ≥ 8%（强势启动信号）：额外 **+8**
  - MA30斜率 > 0.3%/日（趋势强劲）：额外 **+5**
  - 所属板块同日也进入板块成交榜前列（板块共振）：额外 **+5**

  触发任一剔除标准（不进入候选池）：
  - 涨幅 < 5%：sentiment_score **-5**（主力未启动）
  - MA30向下：sentiment_score **-8**（逆势风险高）
  - 净资产为负：sentiment_score **-15**（基本面雷区）

  ---

  ## 每日跟踪机制

  候选池实行动态管理，每日收盘后重新运行完整流程：
  - 上日候选股若今日再次通过三重筛选且仍在前50名：继续保留，标注"连续上榜"天数。
  - 上日候选股若今日跌出前50名或触发任一剔除标准：从候选池移除，标注移除原因。
  - 连续3日以上上榜且MA30持续向上的品种，重点关注，在 `buy_reason` 中注明"成交榜连续上榜"。

  ---

  ## 输出格式要求

  在分析报告中，必须包含：
  - `pattern_analysis` 字段：注明"成交榜选股法 - 全市场第X名"
  - `buy_reason` 字段：说明通过三重筛选的具体数据（涨幅X%、MA30斜率X%、净资产X元）
  - `risk_note` 字段：若候选池为空（三重筛选后无剩余），注明"今日无符合条件品种，建议观望"

  ---

  ## 使用场景与注意事项

  - **最佳使用时机**：每日收盘后（15:30之后）运行，次日开盘前完成分析。
  - **市场适用性**：适用于活跃行情（有主线热点的市场）；在全面熊市或缩量横盘市中，前50名的成交金额门槛会大幅降低，此时候选池质量会下降，建议提高警惕。
  - **仓位建议**：单只候选股仓位不超过总仓位的20%，候选池最多同时持有3只，分散风险。
  - **止损原则**（关联理念1：严格进场标准）：买入后若次日跌破当日最低点，立即止损出局，不恋战。
